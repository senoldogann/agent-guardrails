# Trusted cargo-mutants configuration (human-owned), passed with --config by .agent/bin/mutants-cargo-run;
# the project's .cargo/mutants.toml is never read. Files to mutate come from the kit-computed scope.
test_tool = "cargo"
timeout_multiplier = 10.0
build_timeout_multiplier = 10.0
exclude_globs = []
exclude_re = []
