# Judges every PR with the guard from the DEFAULT branch (pull_request_target), so a PR cannot weaken
# it. PR code is fetched as a git ref and only read, never executed; no caches, no secrets.
# Every PR merges only after the owner approves its exact HEAD: the owner runs the kit's
# `guardrails approve` (or `approve-head <pr>`) in their own terminal, which posts the commit status
# `merge-approval`; the agent's bash-guard blocks both. Repository setup (`guardrails on`): a ruleset
# requiring `guard`, `security`, `checks-<lang>` (GitHub Actions) and `merge-approval`. Job names must stay
# unique.
# With a merge queue (`guardrails on --merge-queue`) the job also reports `guard` on each group commit
# (merge_group). GitHub runs this file from the group's own commit there, so the steps check out the DEFAULT
# branch and run its ci-guard-group, reading the group only as data; a PR that changes these steps is a
# guardrail change the owner confirms, and ci-guard keeps a PR from changing the triggers.
name: agent-guard
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: agent-guard-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch (pull request)
        if: github.event_name == 'pull_request_target'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # On merge_group the default checkout is the group's own commit; the guard must not come from there.
      - name: Check out the default branch (merge group)
        if: github.event_name == 'merge_group'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch the PR head commit this run judges (as data)
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"
      - name: Guard
        if: github.event_name == 'pull_request_target'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          base=$(git merge-base "$GITHUB_SHA" "$HEAD_SHA")
          token=$(openssl rand -hex 16)
          echo "::stop-commands::${token}"
          set +e
          .agent/bin/ci-guard "$base" "$HEAD_SHA" "$HEAD_BRANCH" "$DEFAULT_BRANCH" "$PR_BASE" | tee guard.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "::${token}::"
          {
            echo '### agent-guard'
            echo '```text'
            cat guard.txt
            echo '```'
            echo "Owner approval for exactly this head, in your own terminal: \`approve-head ${PR_URL}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
      # The full checkout already holds the group's gh-readonly-queue branch; fetch only what is missing.
      - name: Fetch the merge group commits this run judges (as data)
        if: github.event_name == 'merge_group'
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags origin "$sha"
          done
      # ci-guard-group reads the group from the event payload itself, so this call never has to change.
      - name: Guard the merge group
        if: github.event_name == 'merge_group'
        run: |
          token=$(openssl rand -hex 16)
          echo "::stop-commands::${token}"
          set +e
          .agent/bin/ci-guard-group "$GITHUB_EVENT_PATH" | tee guard.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "::${token}::"
          {
            echo '### agent-guard (merge group)'
            echo '```text'
            cat guard.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          exit "$status"
