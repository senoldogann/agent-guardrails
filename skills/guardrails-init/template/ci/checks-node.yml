# Re-runs every deterministic check in CI; the agent saying "done" is not evidence.
# `make ci` runs the spec gate (locked tests red on NotImplemented) when HEAD is the commit that
# locked a spec, and the full gate (locked tests green, judged from results files) otherwise.
# Runs on the PR head commit with read-only permissions, no secrets and no caches.
name: checks-node
on: pull_request
permissions:
  contents: read
concurrency:
  group: checks-node-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  checks-node:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: make ci BASE_SHA="$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
