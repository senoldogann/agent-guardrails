# Re-runs every deterministic check in CI; the agent saying "done" is not evidence.
# `make ci` runs the spec gate (locked tests red on NotImplemented) when HEAD is the commit that
# locked a spec, and the full gate (locked tests green, judged from results files) otherwise.
# On a merge queue's group commit (merge_group) it runs the full gate, `make check`: the queue squashes each
# PR into one commit, so the spec gate and the mutation gate, which need the PR's own commits, ran on the PR.
# Runs on the PR head or group commit with read-only permissions, no secrets and no caches.
name: checks-swift
on:
  pull_request:
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: checks-swift-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true
jobs:
  checks-swift:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      # Use the newest Xcode on the runner, so the toolchain is as close as possible to the developers'.
      # Package.swift should still declare the oldest swift-tools-version it needs: runners lag behind.
      - run: |
          xcode=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' | sort -V | tail -n 1)
          [[ -n $xcode ]] && sudo xcode-select -s "$xcode"
          xcodebuild -version
          swift --version
      - run: brew install swiftlint
      - if: github.event_name == 'pull_request'
        run: make ci BASE_SHA="$BASE_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
      - if: github.event_name == 'merge_group'
        run: make check
